name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: plugin syntax
        run: node --check plugin/lib/index.js
      - name: self-test
        run: python3 scripts/selftest.py
