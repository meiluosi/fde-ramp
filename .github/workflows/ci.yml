name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: plugin syntax
        run: node --check plugin/lib/index.js
      - name: plugin unit tests
        run: node --test plugin/test/*.test.mjs
      - name: plugin client build
        run: node plugin/scripts/build-client.mjs && node --check plugin/client/bundle.js && node --check plugin/lib/panel.js
      - name: dashboard smoke
        run: python3 scripts/render_dashboard.py --root examples/web-novel-run --out /tmp/dashboard.html
      - name: self-test
        run: python3 scripts/selftest.py
